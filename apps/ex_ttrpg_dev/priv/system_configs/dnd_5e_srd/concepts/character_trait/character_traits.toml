[character_trait.experience_points]
name = "Experience Points"
total.type = "accumulator"
total.base = "0"

[character_trait.character_level]
name = "Character Level"
level.type = "mapping"
level.input = "character_trait('experience_points').total"
level.steps = [
  [0, 1],
  [300, 2],
  [900, 3],
  [2700, 4],
  [6500, 5],
  [14000, 6],
  [23000, 7],
  [34000, 8],
  [48000, 9],
  [64000, 10],
  [85000, 11],
  [100000, 12],
  [120000, 13],
  [140000, 14],
  [165000, 15],
  [195000, 16],
  [225000, 17],
  [255000, 18],
  [285000, 19],
  [305000, 20],
]

[character_trait.max_hit_points]
name = "Max Hit Points"
points.type = "accumulator"
points.base = "0"

[character_trait.proficiency_bonus]
name = "Proficiency Bonus"
bonus.type = "accumulator"
bonus.base = "floor((character_trait('character_level').level - 1) / 4) + 2"

[character_trait.speed]
name = "Speed"
unit = "feet"
amount.type = "accumulator"
amount.base = "0"

[character_trait.darkvision]
name = "Darkvision"
range.type = "accumulator"
range.base = "0"

[character_trait.initiative]
name = "Initiative"
bonus.type = "accumulator"
bonus.base = "ability('dexterity').modifier"

[character_trait.passive_perception]
name = "Passive Perception"
score.type = "accumulator"
score.base = "10 + skill('perception').modifier"

[character_trait.armor_class]
name = "Armor Class"
base.type = "accumulator"
base.base = "10"
dex_bonus.type = "accumulator"
dex_bonus.base = "ability('dexterity').modifier"
total.formula = "character_trait('armor_class').base + character_trait('armor_class').dex_bonus"

# Counts of equipped armor pieces. Formulas can't inspect inventory directly,
# so each armor item contributes here while equipped; features that apply only
# when unarmored (Unarmored Defense, Draconic Resilience) or out of heavy armor
# (Fast Movement) gate on these with `min(1, ...)`.
[character_trait.armor_worn]
name = "Armor Worn"
hidden = true
body.type = "accumulator"
body.base = "0"
heavy.type = "accumulator"
heavy.base = "0"
shield.type = "accumulator"
shield.base = "0"

[character_trait.spellcasting_ability_modifier]
name = "Spellcasting Ability Modifier"
value.type = "accumulator"
value.base = "0"

[character_trait.spell_save_dc]
name = "Spell Save DC"
score.formula = "8 + character_trait('proficiency_bonus').bonus + character_trait('spellcasting_ability_modifier').value"

[character_trait.spell_attack_bonus]
name = "Spell Attack Bonus"
bonus.formula = "character_trait('proficiency_bonus').bonus + character_trait('spellcasting_ability_modifier').value"

# Caster level for spell slots (SRD 5.0 Multiclassing): full caster levels
# plus half of paladin and ranger levels, rounded down.
[character_trait.caster_level]
name = "Caster Level"
hidden = true
level.type = "accumulator"
level.base = "0"

# Levels in paladin or ranger once they have the Spellcasting feature (2nd
# level); used only when that is the one spellcasting class.
[character_trait.half_caster_level]
name = "Half Caster Level"
hidden = true
level.type = "accumulator"
level.base = "0"

# Counts of the character's classes with a spellcasting ability: `sources`
# counts every one (warlock's Pact Magic included), `full` and `half` only
# those with the Spellcasting feature. `solo_half` is 1 when a lone paladin
# or ranger casts, which uses the half caster table instead of the
# multiclass one.
[character_trait.spellcasting_classes]
name = "Spellcasting Classes"
hidden = true
sources.type = "accumulator"
sources.base = "0"
full.type = "accumulator"
full.base = "0"
half.type = "accumulator"
half.base = "0"
solo_half.type = "mapping"
solo_half.input = "character_trait('spellcasting_classes').half + 10 * character_trait('spellcasting_classes').full"
solo_half.steps = [[0, 0], [1, 1], [2, 0]]

# The Multiclass Spellcaster table, which is also every full caster's own
# table, looked up by caster level: full caster levels plus half of paladin
# and ranger levels (rounded down).
[character_trait.full_caster_slots]
name = "Full Caster Spell Slots"
hidden = true
level_1.type = "mapping"
level_1.input = "character_trait('caster_level').level"
level_1.steps = [[0, 0], [1, 2], [2, 3], [3, 4]]
level_2.type = "mapping"
level_2.input = "character_trait('caster_level').level"
level_2.steps = [[0, 0], [1, 0], [3, 2], [4, 3]]
level_3.type = "mapping"
level_3.input = "character_trait('caster_level').level"
level_3.steps = [[0, 0], [1, 0], [5, 2], [6, 3]]
level_4.type = "mapping"
level_4.input = "character_trait('caster_level').level"
level_4.steps = [[0, 0], [1, 0], [7, 1], [8, 2], [9, 3]]
level_5.type = "mapping"
level_5.input = "character_trait('caster_level').level"
level_5.steps = [[0, 0], [1, 0], [9, 1], [10, 2], [18, 3]]
level_6.type = "mapping"
level_6.input = "character_trait('caster_level').level"
level_6.steps = [[0, 0], [1, 0], [11, 1], [19, 2]]
level_7.type = "mapping"
level_7.input = "character_trait('caster_level').level"
level_7.steps = [[0, 0], [1, 0], [13, 1], [20, 2]]
level_8.type = "mapping"
level_8.input = "character_trait('caster_level').level"
level_8.steps = [[0, 0], [1, 0], [15, 1]]
level_9.type = "mapping"
level_9.input = "character_trait('caster_level').level"
level_9.steps = [[0, 0], [1, 0], [17, 1]]

# The paladin/ranger table, used only when that is the character's one
# spellcasting class, looked up by its class level.
[character_trait.half_caster_slots]
name = "Half Caster Spell Slots"
hidden = true
level_1.type = "mapping"
level_1.input = "character_trait('half_caster_level').level"
level_1.steps = [[0, 0], [1, 0], [2, 2], [3, 3], [5, 4]]
level_2.type = "mapping"
level_2.input = "character_trait('half_caster_level').level"
level_2.steps = [[0, 0], [1, 0], [5, 2], [7, 3]]
level_3.type = "mapping"
level_3.input = "character_trait('half_caster_level').level"
level_3.steps = [[0, 0], [1, 0], [9, 2], [11, 3]]
level_4.type = "mapping"
level_4.input = "character_trait('half_caster_level').level"
level_4.steps = [[0, 0], [1, 0], [13, 1], [15, 2], [17, 3]]
level_5.type = "mapping"
level_5.input = "character_trait('half_caster_level').level"
level_5.steps = [[0, 0], [1, 0], [17, 1], [19, 2]]

[character_trait.spell_slots]
name = "Spell Slots"
level_1.type = "accumulator"
level_1.base = "character_trait('full_caster_slots').level_1 * (1 - character_trait('spellcasting_classes').solo_half) + character_trait('half_caster_slots').level_1 * character_trait('spellcasting_classes').solo_half"
level_2.type = "accumulator"
level_2.base = "character_trait('full_caster_slots').level_2 * (1 - character_trait('spellcasting_classes').solo_half) + character_trait('half_caster_slots').level_2 * character_trait('spellcasting_classes').solo_half"
level_3.type = "accumulator"
level_3.base = "character_trait('full_caster_slots').level_3 * (1 - character_trait('spellcasting_classes').solo_half) + character_trait('half_caster_slots').level_3 * character_trait('spellcasting_classes').solo_half"
level_4.type = "accumulator"
level_4.base = "character_trait('full_caster_slots').level_4 * (1 - character_trait('spellcasting_classes').solo_half) + character_trait('half_caster_slots').level_4 * character_trait('spellcasting_classes').solo_half"
level_5.type = "accumulator"
level_5.base = "character_trait('full_caster_slots').level_5 * (1 - character_trait('spellcasting_classes').solo_half) + character_trait('half_caster_slots').level_5 * character_trait('spellcasting_classes').solo_half"
level_6.type = "accumulator"
level_6.base = "character_trait('full_caster_slots').level_6 * (1 - character_trait('spellcasting_classes').solo_half)"
level_7.type = "accumulator"
level_7.base = "character_trait('full_caster_slots').level_7 * (1 - character_trait('spellcasting_classes').solo_half)"
level_8.type = "accumulator"
level_8.base = "character_trait('full_caster_slots').level_8 * (1 - character_trait('spellcasting_classes').solo_half)"
level_9.type = "accumulator"
level_9.base = "character_trait('full_caster_slots').level_9 * (1 - character_trait('spellcasting_classes').solo_half)"

[character_trait.pact_magic]
name = "Pact Magic"
slot_count.type = "accumulator"
slot_count.base = "0"
slot_level.type = "accumulator"
slot_level.base = "0"

[character_trait.cantrips_known]
name = "Cantrips Known"
hidden = true
count.type = "accumulator"
count.base = "0"

[character_trait.spells_known]
name = "Spells Known"
hidden = true
count.type = "accumulator"
count.base = "0"

# The highest spell level any of the character's classes can learn or
# prepare. Per-class spell lists (#222) would cap each class by its own.
[character_trait.max_spell_level]
name = "Max Spell Level"
hidden = true
level.type = "accumulator"
level.base = "max(class('bard').max_spell_level, max(class('cleric').max_spell_level, max(class('druid').max_spell_level, max(class('paladin').max_spell_level, max(class('ranger').max_spell_level, max(class('sorcerer').max_spell_level, max(class('wizard').max_spell_level, class('warlock').pact_slot_level)))))))"

[character_trait.asi_count]
name = "ASI/Feat Slots"
hidden = true
count.type = "accumulator"
count.base = "0"
