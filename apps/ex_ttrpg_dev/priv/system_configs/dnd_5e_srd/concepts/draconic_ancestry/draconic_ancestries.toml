# Draconic Ancestry table (Dragonborn). The chosen ancestry sets the breath
# weapon's damage type, area and saving throw, and the damage resistance.

[draconic_ancestry.black]
name = "Black Dragon"
damage_type = "acid"
damage_resistances = ["acid"]
breath_weapon_area = "5 by 30 ft. line"
breath_weapon_save = "dexterity"

