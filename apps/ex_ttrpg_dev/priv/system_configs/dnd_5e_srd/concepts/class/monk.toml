[class.monk]
name = "Monk"
hit_die = "d8"
weapon_proficiencies = ["Simple Weapons", "Shortsword"]

asi_slots.type = "mapping"
asi_slots.input = "class('monk').level"
asi_slots.steps = [[0, 0], [1, 0], [4, 1], [8, 2], [12, 3], [16, 4], [19, 5]]

# Class table: Martial Arts die size.
martial_arts_die.type = "mapping"
martial_arts_die.input = "class('monk').level"
martial_arts_die.steps = [[0, 0], [1, 4], [5, 6], [11, 8], [17, 10]]
# Ki points equal monk level, from 2nd level.
ki_points.formula = "class('monk').level * min(1, max(0, class('monk').level - 1))"
# Ki save DC.
ki_save_dc.formula = "8 + character_trait('proficiency_bonus').bonus + ability('wisdom').modifier"
# Class table: Unarmored Movement bonus (feet).
unarmored_movement.type = "mapping"
unarmored_movement.input = "class('monk').level"
unarmored_movement.steps = [[0, 0], [1, 0], [2, 10], [6, 15], [10, 20], [14, 25], [18, 30]]
# Extra Attack: attacks per Attack action.
attacks_per_action.type = "mapping"
attacks_per_action.input = "class('monk').level"
attacks_per_action.steps = [[0, 0], [1, 1], [5, 2]]

[class.monk.choices.subclass]
required = true
type = "class"
options = ["way_of_the_open_hand"]

[class.monk.choices.tool_proficiency]
required = true
type = "equipment"
options = [
  "alchemists_supplies",
  "brewers_supplies",
  "calligraphers_supplies",
  "carpenters_tools",
  "cartographers_tools",
  "cobblers_tools",
  "cooks_utensils",
  "glassblowers_tools",
  "jewelers_tools",
  "leatherworkers_tools",
  "masons_tools",
  "painters_supplies",
  "potters_tools",
  "smiths_tools",
  "tinkers_tools",
  "weavers_tools",
  "woodcarvers_tools",
  "bagpipes",
  "drum",
  "dulcimer",
  "flute",
  "lute",
  "lyre",
  "horn",
  "pan_flute",
  "shawm",
  "viol",
]

[class.monk.choices.skill_proficiency_1]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = ["acrobatics", "athletics", "history", "insight", "religion", "stealth"]

[class.monk.choices.skill_proficiency_2]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = ["acrobatics", "athletics", "history", "insight", "religion", "stealth"]

[[class.monk.contributes]]
target = "saving_throw('strength').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.monk.contributes]]
target = "saving_throw('dexterity').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.monk.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier + 8"
first_class_only = true

[[class.monk.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier * (character_trait('character_level').level - 1)"
first_class_only = true

[[class.monk.contributes]]
target = "character_trait('asi_count').count"
value = "class('monk').asi_slots"

# Unarmored Defense: AC = 10 + Dex + Wis while wearing no armor and wielding no shield.
[[class.monk.contributes]]
target = "character_trait('armor_class').base"
value = "ability('wisdom').modifier * (1 - min(1, character_trait('armor_worn').body + character_trait('armor_worn').shield))"

# Unarmored Movement: applies only without armor or a shield.
[[class.monk.contributes]]
target = "character_trait('speed').amount"
value = "class('monk').unarmored_movement * (1 - min(1, character_trait('armor_worn').body + character_trait('armor_worn').shield))"

[class.way_of_the_open_hand]
name = "Way of the Open Hand"
