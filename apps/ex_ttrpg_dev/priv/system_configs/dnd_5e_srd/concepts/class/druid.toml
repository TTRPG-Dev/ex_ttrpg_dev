[class.druid]
name = "Druid"
hit_die = "d8"
armor_proficiencies = ["Light Armor", "Medium Armor", "Shield"]
weapon_proficiencies = ["Club", "Dagger", "Dart", "Javelin", "Mace", "Quarterstaff", "Scimitar", "Sickle", "Sling", "Spear"]
tool_proficiencies = ["Herbalism Kit"]
preparation_mode = "prepared"
preparation_pool = "class_spells"

asi_slots.type = "mapping"
asi_slots.input = "class('druid').level"
asi_slots.steps = [[0, 0], [1, 0], [4, 1], [8, 2], [12, 3], [16, 4], [19, 5]]

# Wild Shape uses per short or long rest.
wild_shape_uses.type = "mapping"
wild_shape_uses.input = "class('druid').level"
wild_shape_uses.steps = [[0, 0], [1, 0], [2, 2]]
# Archdruid: unlimited Wild Shape at 20th level.
wild_shape_unlimited.formula = "class('druid').level >= 20"
# Beast Shapes table: highest challenge rating.
wild_shape_max_cr.type = "mapping"
wild_shape_max_cr.input = "class('druid').level"
wild_shape_max_cr.steps = [[0, 0], [1, 0], [2, 0.25], [4, 0.5], [8, 1]]
# Beast Shapes table: swimming speed allowed (1) from 4th level.
wild_shape_swim.type = "mapping"
wild_shape_swim.input = "class('druid').level"
wild_shape_swim.steps = [[0, 0], [1, 0], [4, 1]]
# Beast Shapes table: flying speed allowed (1) from 8th level.
wild_shape_fly.type = "mapping"
wild_shape_fly.input = "class('druid').level"
wild_shape_fly.steps = [[0, 0], [1, 0], [8, 1]]

# Spellcasting for this class: its own ability, DC and attack bonus. A
# multiclassed caster has one of each per class (SRD 5.0 Multiclassing).
[class.druid.spell_save_dc]
formula = "8 + character_trait('proficiency_bonus').bonus + ability('wisdom').modifier"

[class.druid.spell_attack_bonus]
formula = "character_trait('proficiency_bonus').bonus + ability('wisdom').modifier"

[[class.druid.contributes]]
target = "character_trait('spellcasting_classes').sources"
value = "1"

[[class.druid.contributes]]
target = "character_trait('spellcasting_classes').full"
value = 1

[[class.druid.contributes]]
target = "character_trait('caster_level').level"
value = "class('druid').level"

# Multiclassing (SRD 5.0): the prerequisite to take or leave this class, and the
# reduced proficiencies and choices it grants as a second or later class.
[class.druid.multiclass]
prerequisite = "ability('wisdom').total_score >= 13"
armor_proficiencies = ["Light Armor", "Medium Armor", "Shield"]
choices = ["subclass"]

[class.druid.choices.subclass]
required = true
type = "class"
options = ["circle_of_the_land"]

[class.druid.choices.skill_proficiency_1]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = [
  "arcana",
  "animal_handling",
  "insight",
  "medicine",
  "nature",
  "perception",
  "religion",
  "survival",
]

[class.druid.choices.skill_proficiency_2]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = [
  "arcana",
  "animal_handling",
  "insight",
  "medicine",
  "nature",
  "perception",
  "religion",
  "survival",
]

[[class.druid.contributes]]
target = "saving_throw('intelligence').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.druid.contributes]]
target = "saving_throw('wisdom').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.druid.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier + 8"
first_class_only = true

[[class.druid.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier * (character_trait('character_level').level - 1)"
first_class_only = true

[[class.druid.contributes]]
target = "character_trait('spellcasting_ability_modifier').value"
value = "ability('wisdom').modifier"
# Character-wide only for a single spellcasting class; multiclassed
# casters use each class's spell_save_dc / spell_attack_bonus.
when = "character_trait('spellcasting_classes').sources == 1"

[[class.druid.contributes]]
target = "character_trait('cantrips_known').count"
value = "class('druid').cantrips_known_count"

[class.druid.cantrips_known_count]
type = "mapping"
input = "class('druid').level"
steps = [[0, 0], [1, 2], [4, 3], [10, 4]]

[class.druid.max_spell_level]
type = "mapping"
input = "class('druid').level"
steps = [[0, 0], [1, 1], [3, 2], [5, 3], [7, 4], [9, 5], [11, 6], [13, 7], [15, 8], [17, 9]]

[[class.druid.contributes]]
target = "character_trait('asi_count').count"
value = "class('druid').asi_slots"

[class.druid.preparation_cap]
type = "formula"
formula = "ability('wisdom').modifier + class('druid').level"

[class.circle_of_the_land]
name = "Circle of the Land"
