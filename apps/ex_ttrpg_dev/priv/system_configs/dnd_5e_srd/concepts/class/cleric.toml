[class.cleric]
name = "Cleric"
hit_die = "d8"
armor_proficiencies = ["Light Armor", "Medium Armor", "Shield"]
weapon_proficiencies = ["Simple Weapons"]
preparation_mode = "prepared"
preparation_pool = "class_spells"

asi_slots.type = "mapping"
asi_slots.input = "class('cleric').level"
asi_slots.steps = [[0, 0], [1, 0], [4, 1], [8, 2], [12, 3], [16, 4], [19, 5]]

# Channel Divinity uses per short or long rest.
channel_divinity_uses.type = "mapping"
channel_divinity_uses.input = "class('cleric').level"
channel_divinity_uses.steps = [[0, 0], [1, 0], [2, 1], [6, 2], [18, 3]]
# Destroy Undead: highest challenge rating destroyed.
destroy_undead_cr.type = "mapping"
destroy_undead_cr.input = "class('cleric').level"
destroy_undead_cr.steps = [[0, 0], [1, 0], [5, 0.5], [8, 1], [11, 2], [14, 3], [17, 4]]

# Multiclassing (SRD 5.0): the prerequisite to take or leave this class, and the
# reduced proficiencies and choices it grants as a second or later class.
[class.cleric.multiclass]
prerequisite = "ability('wisdom').total_score >= 13"
armor_proficiencies = ["Light Armor", "Medium Armor", "Shield"]
choices = ["subclass"]

[class.cleric.choices.subclass]
required = true
type = "class"
options = ["life_domain"]

[class.cleric.choices.skill_proficiency_1]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = ["history", "insight", "medicine", "persuasion", "religion"]

[class.cleric.choices.skill_proficiency_2]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = ["history", "insight", "medicine", "persuasion", "religion"]

[[class.cleric.contributes]]
target = "saving_throw('wisdom').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.cleric.contributes]]
target = "saving_throw('charisma').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.cleric.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier + 8"
first_class_only = true

[[class.cleric.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier * (character_trait('character_level').level - 1)"
first_class_only = true

[[class.cleric.contributes]]
target = "character_trait('spellcasting_ability_modifier').value"
value = "ability('wisdom').modifier"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_1"
value = "character_trait('full_caster_slots').level_1"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_2"
value = "character_trait('full_caster_slots').level_2"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_3"
value = "character_trait('full_caster_slots').level_3"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_4"
value = "character_trait('full_caster_slots').level_4"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_5"
value = "character_trait('full_caster_slots').level_5"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_6"
value = "character_trait('full_caster_slots').level_6"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_7"
value = "character_trait('full_caster_slots').level_7"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_8"
value = "character_trait('full_caster_slots').level_8"

[[class.cleric.contributes]]
target = "character_trait('spell_slots').level_9"
value = "character_trait('full_caster_slots').level_9"

[[class.cleric.contributes]]
target = "character_trait('cantrips_known').count"
value = "class('cleric').cantrips_known_count"

[[class.cleric.contributes]]
target = "character_trait('max_spell_level').level"
value = "class('cleric').max_spell_level"

[class.cleric.cantrips_known_count]
type = "mapping"
input = "class('cleric').level"
steps = [[0, 0], [1, 3], [4, 4], [10, 5]]

[class.cleric.max_spell_level]
type = "mapping"
input = "class('cleric').level"
steps = [[0, 0], [1, 1], [3, 2], [5, 3], [7, 4], [9, 5], [11, 6], [13, 7], [15, 8], [17, 9]]

[[class.cleric.contributes]]
target = "character_trait('asi_count').count"
value = "class('cleric').asi_slots"

[class.cleric.preparation_cap]
type = "formula"
formula = "ability('wisdom').modifier + class('cleric').level"

[class.life_domain]
name = "Life Domain"
armor_proficiencies = ["Heavy Armor"]
always_prepared = [
  "bless", "cure_wounds",
  "lesser_restoration", "spiritual_weapon",
  "beacon_of_hope", "revivify",
  "death_ward",
  "mass_cure_wounds", "raise_dead",
]
