[class.fighter]
name = "Fighter"
hit_die = "d10"
armor_proficiencies = ["Light Armor", "Medium Armor", "Heavy Armor", "Shield"]
weapon_proficiencies = ["Simple Weapons", "Martial Weapons"]

# Starting equipment choices (per D&D 5e SRD)
asi_slots.type = "mapping"
asi_slots.input = "class('fighter').level"
asi_slots.steps = [[0, 0], [1, 0], [4, 1], [6, 2], [8, 3], [12, 4], [14, 5], [16, 6], [19, 7]]

# Action Surge uses per short or long rest.
action_surge_uses.type = "mapping"
action_surge_uses.input = "class('fighter').level"
action_surge_uses.steps = [[0, 0], [1, 0], [2, 1], [17, 2]]
# Indomitable uses per long rest.
indomitable_uses.type = "mapping"
indomitable_uses.input = "class('fighter').level"
indomitable_uses.steps = [[0, 0], [1, 0], [9, 1], [13, 2], [17, 3]]
# Extra Attack: attacks per Attack action.
attacks_per_action.type = "mapping"
attacks_per_action.input = "class('fighter').level"
attacks_per_action.steps = [[0, 0], [1, 1], [5, 2], [11, 3], [20, 4]]
# Second Wind heals 1d10 + this value.
second_wind_bonus.formula = "class('fighter').level"

[class.fighter.choices.starting_armor]
required = true
type = "equipment"
grants_to = "inventory"
options = ["chain_mail", "leather_armor"]

[class.fighter.choices.starting_weapon]
required = true
type = "equipment"
grants_to = "inventory"
options = [
  "longsword",
  "battleaxe",
  "flail",
  "handaxe",
  "mace",
  "shortsword",
  "warhammer",
]

# Multiclassing (SRD 5.0): the prerequisite to take or leave this class, and the
# reduced proficiencies and choices it grants as a second or later class.
[class.fighter.multiclass]
prerequisite = "ability('strength').total_score >= 13 or ability('dexterity').total_score >= 13"
armor_proficiencies = ["Light Armor", "Medium Armor", "Shield"]
weapon_proficiencies = ["Simple Weapons", "Martial Weapons"]
choices = ["subclass"]

[class.fighter.choices.subclass]
required = true
type = "class"
options = ["champion"]

[class.fighter.choices.skill_proficiency_1]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = [
  "acrobatics",
  "animal_handling",
  "athletics",
  "history",
  "insight",
  "intimidation",
  "perception",
  "survival",
]

[class.fighter.choices.skill_proficiency_2]
required = true
type = "skill"
contributes_field = "modifier"
contributes_value = "character_trait('proficiency_bonus').bonus"
options = [
  "acrobatics",
  "animal_handling",
  "athletics",
  "history",
  "insight",
  "intimidation",
  "perception",
  "survival",
]

[[class.fighter.contributes]]
target = "saving_throw('strength').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.fighter.contributes]]
target = "saving_throw('constitution').modifier"
value = "character_trait('proficiency_bonus').bonus"
first_class_only = true

[[class.fighter.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier + 10"
first_class_only = true

[[class.fighter.contributes]]
target = "character_trait('max_hit_points').points"
value = "ability('constitution').modifier * (character_trait('character_level').level - 1)"
first_class_only = true

[[class.fighter.contributes]]
target = "character_trait('asi_count').count"
value = "class('fighter').asi_slots"

[class.champion]
name = "Champion"

# Improved / Superior Critical: lowest d20 roll that scores a critical hit.
critical_range.type = "mapping"
critical_range.input = "class('fighter').level"
critical_range.steps = [[0, 0], [1, 20], [3, 19], [15, 18]]
